apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {app: backend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend, version: v1}
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo
          args: ["-text=backend v1"]
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {app: backend}
spec:
  selector: {app: backend}
  ports:
    - name: http
      port: 5678
      targetPort: 5678