apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  labels: {app: product, version: v1}
spec:
  replicas: 1
  selector:
    matchLabels: {app: product, version: v1}
  template:
    metadata:
      labels: {app: product, version: v1}
    spec:
      containers:
        - name: product
          image: product
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: product
  labels: {app: product}
spec:
  selector: {app: product}
  ports:
    - name: http
      port: 80
      targetPort: 8080