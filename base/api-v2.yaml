apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v2
  labels: {app: api, version: v2}
spec:
  replicas: 1
  selector:
    matchLabels: {app: api, version: v2}
  template:
    metadata:
      labels: {app: api, version: v2}
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo
          args: ["-text=api v2"]
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app: api}
spec:
  selector: {app: api}
  ports:
    - name: http
      port: 5678
      targetPort: 5678