apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: msa-gateway
spec:
  selector:
    istio: ingress
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: msa
spec:
  hosts:
    - "*"
  gateways:
    - msa-gateway
  http:
    - match:
        - uri:
            prefix: /api/products
      route:
        - destination:
            host: product
            subset: v1
            port:
              number: 80
    - route:
        - destination:
            host: frontend
            port:
              number: 80