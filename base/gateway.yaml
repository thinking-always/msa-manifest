apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: msa-gateway
spec:
  selector:
    istio: ingress
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: msa
spec:
  hosts:
    - "*"
  gateways:
    - msa-gateway
  http:
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: api
            subset: v1
            port:
              number: 5678
          weight: 90
        - destination:
            host: api
            subset: v2
            port:
              number: 5678
          weight: 10
    
    
