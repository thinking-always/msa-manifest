apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: msa
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5678
          - path: /backend
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5678
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80