apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  labels: {app: order, version: v1}
spec:
  replicas: 1
  selector:
    matchLabels: {app: order, version: v1}
  template:
    metadata:
      labels: {app: order, version: v1}
    spec:
      containers:
        - name: order
          image: order
          ports:
            - containerPort: 8080
          env:
            - name: PRODUCT_URL
              value: "http://product"
            - name: PAYMENT_URL
              value: "http://payment"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: order
  labels: {app: order}
spec:
  selector: {app: order}
  ports:
    - name: http
      port: 80
      targetPort: 8080