apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: <https://traefik.github.io/charts>
    chart: traefik
    targetRevision: CHANGE_ME
    helm:
      releaseName: traefik
      valuesObject:
        service:
          spec:
            type: NodePort
        ports:
          web:
            nodePort: 30080
          websecure:
            nodePort: 30443
        providers:
          kubernetesIngress:
            ingressEndpoint:
              ip: 127.0.0.1
  destination:
    server: <https://kubernetes.default.svc>
    namespace: traefik
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true