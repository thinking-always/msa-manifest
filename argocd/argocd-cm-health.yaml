apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm        # patch 파일은 argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  resource.customizations.health.networking.k8s.io_Ingress: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "Ingress health check skipped (kind)"
    return hs