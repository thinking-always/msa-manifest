apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: msa-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/thinking-always/msa-manifest.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: msa-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true