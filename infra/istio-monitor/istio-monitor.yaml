apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-monitor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/thinking-always/msa-manifest.git
    targetRevision: main
    path: infra/istio-monitor
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true