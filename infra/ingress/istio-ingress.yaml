apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: istio-gw
  namespace: istio-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: istio-ingress
                port:
                  number: 80